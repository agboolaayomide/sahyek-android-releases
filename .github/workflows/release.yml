name: Signed SAHYEK APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/club-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare branded native shell
        env:
          FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_CONFIG }}
        run: |
          set -euo pipefail
          npm init -y
          npm install --save-exact @capacitor/core@8.6.0 @capacitor/cli@8.6.0 @capacitor/android@8.6.0 @capacitor/app@8.1.2 @capacitor/browser@8.0.5 @capacitor/push-notifications@8.1.3 @capacitor/splash-screen@8.0.2
          mkdir www
          echo '<!doctype html><html><head><title>SAHYEK F.C.</title></head><body>SAHYEK F.C.</body></html>' > www/index.html
          curl -fsS https://sahyekfootball.live/club-icon-512.png -o www/club-icon.png
          echo '<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reconnect — SAHYEK F.C.</title></head><body><h1>SAHYEK F.C.</h1><p>Club records need an internet connection.</p><a href="https://sahyekfootball.live">Try again</a></body></html>' > www/offline.html
          echo '{"appId":"live.sahyekfootball.app","appName":"SAHYEK F.C.","webDir":"www","server":{"url":"https://sahyekfootball.live/account","errorPath":"offline.html","cleartext":false,"allowNavigation":["sahyekfootball.live","www.sahyekfootball.live"]},"android":{"backgroundColor":"#05223f","allowMixedContent":false},"plugins":{"SplashScreen":{"backgroundColor":"#05223f","androidScaleType":"CENTER_INSIDE","showSpinner":false,"launchShowDuration":1800,"launchFadeOutDuration":250}}}' > capacitor.config.json
          npx cap add android
          pip install pillow
          python3 prepare.py
          npx cap sync android
          if [ -n "$FIREBASE_ANDROID_CONFIG" ]; then printf '%s' "$FIREBASE_ANDROID_CONFIG" > android/app/google-services.json; python3 validate-firebase.py; fi
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr
      - name: Build signed APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon lintRelease testReleaseUnitTest assembleRelease
      - name: Verify package signature and compiled splash resources
        run: |
          mkdir release
          cp android/app/build/outputs/apk/release/app-release.apk release/sahyek-fc-1.0.2.apk
          APK_PATH=release/sahyek-fc-1.0.2.apk python3 verify.py
      - name: Enable acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install launch and inspect loaded screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -accel on
          script: |
            adb install release/sahyek-fc-1.0.2.apk
            adb shell am start -W -n live.sahyekfootball.app/.MainActivity | tee launch.txt
            grep -q 'Status: ok' launch.txt
            for i in $(seq 1 30); do adb shell pidof live.sahyekfootball.app; sleep 1; done
            adb shell dumpsys activity activities > release/activity.txt
            grep -q 'live.sahyekfootball.app/.MainActivity' release/activity.txt
            adb shell screencap -p /sdcard/launch.png
            adb pull /sdcard/launch.png release/emulator-launch.png
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml release/emulator-window.xml
            adb shell input swipe 160 530 160 180 600
            sleep 2
            adb shell screencap -p /sdcard/scrolled.png
            adb pull /sdcard/scrolled.png release/emulator-scrolled.png
            adb logcat -d -s Capacitor chromium AndroidRuntime > release/runtime-log.txt
            python3 verify-screen.py
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-verification
          path: release/
      - name: Publish checked bytes
        run: |
          set -euo pipefail
          gh release create android-v1.0.2 --draft --title 'SAHYEK F.C. Android 1.0.2' --notes 'Native Capacitor account launch with canonical club-host navigation and version checks. Package, signing certificate, compiled splash and rendered Android 15 account screen checked. Physical-device sign-in and native push remain unverified; Firebase Android configuration is pending.' release/*
          mkdir downloaded
          gh release download android-v1.0.2 --dir downloaded
          cmp release/sahyek-fc-1.0.2.apk downloaded/sahyek-fc-1.0.2.apk
          gh release edit android-v1.0.2 --draft=false --latest
          curl -fsSL "https://github.com/$GH_REPO/releases/download/android-v1.0.2/sahyek-fc-1.0.2.apk" -o public.apk
          cmp release/sahyek-fc-1.0.2.apk public.apk
      - name: Remove signing key
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
